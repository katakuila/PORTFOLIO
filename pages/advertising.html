<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toke Nikolaishvili — Advertising</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css?v=10">
</head>
<body>
  <div class="bg-layer bg-primary"></div>
  <div class="bg-layer bg-dark"></div>
  <div class="bg-layer bg-overlay"></div>

  <header class="site-header">
    <a href="/index.html" class="site-logo">Toke Nikolaishvili</a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="/index.html">Home</a>
      <a href="/pages/advertising.html">Advertising</a>
      <a href="/pages/artist.html">Artist</a>
      <a href="/pages/contact.html">Contact</a>
    </nav>
  </header>

  <div class="music-toggle-rail" id="musicToggleRail">
    <button type="button" class="music-toggle" id="musicToggle" aria-label="Mute music" aria-pressed="false">
      <span class="music-toggle__viz" aria-hidden="true">
        <svg class="music-toggle__wave" viewBox="0 0 24 14" width="24" height="14" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
          <path class="music-toggle__wave-path music-toggle__wave-path--back" d="M0 7 C2 5.5 4 8.5 6 7 S10 5.5 12 7 S16 8.5 18 7 S22 5.5 24 7"/>
          <path class="music-toggle__wave-path music-toggle__wave-path--front" d="M0 7 C2 8.5 4 5.5 6 7 S10 8.5 12 7 S16 5.5 18 7 S22 8.5 24 7"/>
        </svg>
      </span>
      <svg class="music-toggle__icon music-toggle__icon--off" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="16" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div id="page-root">

            <img class="video-thumb__img" src="../images/thumbnails/Tbc%20thumbnail.jpeg" alt="TBC Offers thumbnail" loading="lazy">
            <div class="play-btn">
              <svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M2 2L16 10L2 18V2Z" fill="white" opacity="0.9"/></svg>
            </div>
          </div>
          <div class="vcard-info">
            <p class="vcard-title">TBC Offers</p>
            <p class="vcard-category">Advertising</p>
          </div>
        </div>

        <div class="vcard">
          <div class="video-thumb" data-src="https://www.youtube.com/shorts/yljSP4HZ9Ps" data-poster="../images/thumbnails/Lamborgini%20thumbnail.jpeg">

              <svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M2 2L16 10L2 18V2Z" fill="white" opacity="0.9"/></svg>
            </div>
          </div>
          <div class="vcard-info">
            <p class="vcard-title">Lamborghini</p>
            <p class="vcard-category">Advertising</p>

        </div>

        <div class="vcard">
          <div class="video-thumb" data-src="https://www.youtube.com/watch?v=fHNIaM6iUZc" data-poster="../images/thumbnails/Tbc%202%20thumbnail.jpeg">
            <img class="video-thumb__img" src="../images/thumbnails/Tbc%202%20thumbnail.jpeg" alt="TBC Offers 2 thumbnail" loading="lazy">
            <div class="play-btn">
              <svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M2 2L16 10L2 18V2Z" fill="white" opacity="0.9"/></svg>
            </div>
          </div>
          <div class="vcard-info">
            <p class="vcard-title">TBC Offers 2</p>
            <p class="vcard-category">Advertising</p>

        <div class="vcard">
          <div class="video-thumb" data-src="https://www.youtube.com/shorts/gJbPbMle_Ng" data-poster="../images/thumbnails/Tbc%203%20thumbnail.jpeg">

              <svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M2 2L16 10L2 18V2Z" fill="white" opacity="0.9"/></svg>
            </div>
          </div>
          <div class="vcard-info">
            <p class="vcard-title">TBC Offers 3</p>

            <div class="play-btn">
              <svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M2 2L16 10L2 18V2Z" fill="white" opacity="0.9"/></svg>
            </div>
          </div>
          <div class="vcard-info">
            <p class="vcard-title">Bakuriani World Ski Sport Championship</p>
            <p class="vcard-category">Advertising</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  </div>

  <div class="soundcloud-hidden" id="soundcloudBar" data-track="https://soundcloud.com/batterdown/indigo" data-bpm="130" data-beat-offset="1">
    <iframe
      id="soundcloudPlayer"
      title="SoundCloud player"
      allow="autoplay"
      scrolling="no"
      frameborder="no"
    ></iframe>
  </div>

  <script src="../script.js?v=12"></script>
