<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toke Nikolaishvili — Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-layer bg-primary"></div>
  <div class="bg-layer bg-dark"></div>
  <div class="bg-layer bg-overlay"></div>

  <header class="site-header">
    <a href="index.html" class="site-logo">Toke</a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
      <span class="nav-toggle__bar" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="pages/about.html">About</a>
      <a href="pages/advertising.html">Advertising</a>
      <a href="pages/games.html">Games</a>
      <a href="pages/artist.html">Artist</a>
      <a href="pages/contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-content home-hero">
    <div class="home-audio">
      <canvas id="radialCanvas" width="420" height="420" role="img" aria-label="Audio visualizer"></canvas>
      <button type="button" class="audio-play-btn" id="audioPlayBtn" aria-label="Play music">
        <svg width="22" height="24" viewBox="0 0 18 20" fill="none" aria-hidden="true"><path d="M2 2L16 10L2 18V2Z" fill="currentColor"/></svg>
      </button>
    </div>
    <p class="audio-hint" id="audioHint">Tap play to listen</p>
  </main>

  <div class="soundcloud-hidden" id="soundcloudBar" data-track="https://soundcloud.com/trommelmusic/premiere-a1-toke-pero-ppr004">
    <iframe
      id="soundcloudPlayer"
      title="SoundCloud player"
      allow="autoplay; encrypted-media"
      scrolling="no"
      frameborder="no"
    ></iframe>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="script.js"></script>
</body>
</html>
